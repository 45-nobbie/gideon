
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gideon-cli"
version = "0.1.0"
description = "Sir Gideon, the All-Knowing — your command-line companion"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
]

[project.scripts]
gideon = "gideon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
